# Alembic Database Migration Configuration
# This file tells Alembic how to connect to your DB and where to find models

[alembic]
# Path to migration scripts
script_location = migrations

# Your database URL — reads from .env automatically
sqlalchemy.url = postgresql://postgres:yourpassword@localhost:5432/ai_interview_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
